<div class="fixed inset-0 z-40 grid place-items-end bg-ink/40 p-0 sm:place-items-center sm:p-6" (click)="close()">
  <section
    class="card guest-dialog max-h-[92dvh] w-full overflow-auto rounded-b-none p-4 sm:max-w-2xl sm:rounded-3xl sm:p-5"
    role="dialog"
    aria-modal="true"
    aria-labelledby="reserve-title"
    (click)="$event.stopPropagation()"
  >
    <p class="dialog-form-note">Vas a reservar</p>
    <h2 id="reserve-title" class="mt-1 font-serif text-2xl">{{ gift().name }}</h2>
    <p class="mt-1 text-sm leading-5 text-ink/70">
      Al confirmar, este regalo queda reservado para vos y las demás personas lo van a ver como no disponible.
    </p>
    <form class="dialog-form mt-3 grid sm:grid-cols-2" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block">
        <span class="label">Nombre y apellido</span>
        <input class="field" formControlName="name" autocomplete="name" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <span class="field-error">Ingresá nombre y apellido.</span>
        }
      </label>
      <label class="block">
        <span class="label">Teléfono</span>
        <input class="field" formControlName="phone" autocomplete="tel" inputmode="tel" placeholder="2494 000000" />
        @if (form.controls.phone.touched && form.controls.phone.invalid) {
          <span class="field-error">Ingresá un teléfono válido.</span>
        }
      </label>
      <label class="block sm:col-span-2">
        <span class="label">Email</span>
        <input class="field" type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="field-error">Ingresá un email para enviarte la confirmación.</span>
        }
      </label>
      <label class="block sm:col-span-2">
        <span class="label">Mensaje (opcional)</span>
        <textarea class="field resize-none" formControlName="message"></textarea>
      </label>
      <label class="flex items-start gap-3 text-sm leading-5 sm:col-span-2">
        <input class="reserve-check mt-1 size-4" type="checkbox" formControlName="consent" />
        <span>Entiendo que al reservar este regalo estoy indicando mi intención de comprarlo.</span>
      </label>
      @if (form.controls.consent.touched && form.controls.consent.invalid) {
        <p class="field-error sm:col-span-2">Necesitamos esa confirmación para reservar.</p>
      }
      @if (error()) {
        <p class="alert alert-error sm:col-span-2">{{ error() }}</p>
      }
      <div class="flex flex-wrap gap-2 sm:col-span-2">
        <button type="submit" class="btn-primary disabled:pointer-events-none disabled:opacity-50" [disabled]="submitting() || example()">
          {{ submitting() ? 'Reservando…' : 'Confirmar reserva' }}
        </button>
        <button type="button" class="btn-secondary" (click)="close()" [disabled]="submitting()">Volver</button>
      </div>
    </form>
  </section>
</div>
