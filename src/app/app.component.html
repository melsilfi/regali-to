@if (!auth.ready()) {
  <div class="grid min-h-dvh place-items-center text-sm text-muted">Cargando…</div>
} @else if (auth.user()) {
  <div class="app-shell">
    <app-side-nav />
    <div class="app-shell-main">
      <p-toast position="top-center" />
      @if (toast.burst()) {
        <div class="gift-celebrate" aria-hidden="true">
          <img src="/logo-gift.png" alt="" (animationend)="toast.finishBurst($event)" />
        </div>
      }
      <main>
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <div class="min-h-dvh">
    <header class="sticky top-0 z-20 border-b border-[#eef0f3] bg-white">
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-2 px-4 py-2 sm:h-16 sm:px-5 sm:py-0">
        <a routerLink="/" class="site-logo">
          <img src="/logo.png" alt="regali.to" />
        </a>
        <nav class="site-nav flex min-w-0 items-center justify-end gap-1 sm:gap-2">
          <p-button label="Ingresar" icon="pi pi-sign-in" [rounded]="true" severity="secondary" ariaLabel="Ingresar" (onClick)="go('/ingresar')" />
          <p-button label="Crear cuenta" icon="pi pi-user-plus" [rounded]="true" ariaLabel="Crear cuenta" (onClick)="go('/registro')" />
        </nav>
      </div>
    </header>
    <p-toast position="top-center" />
    @if (toast.burst()) {
      <div class="gift-celebrate" aria-hidden="true">
        <img src="/logo-gift.png" alt="" (animationend)="toast.finishBurst($event)" />
      </div>
    }
    <main>
      <router-outlet />
    </main>
  </div>
}
